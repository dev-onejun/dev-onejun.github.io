name: Check for broken links

on:
  push:
    branches:
      - gh-pages
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/**"
  pull_request:
    branches:
      - gh-pages
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          args: --user-agent 'curl/7.54' --exclude-path README.md --exclude-path 404.md --verbose --no-progress './**/*.md' './**/*.html'
